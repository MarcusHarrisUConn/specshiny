schema_version: 1.2.0
metadata:
  title: 2-Level School Linear Power Simulation (Random Slopes, MAR Missingness)
  description: Compiled from natural-language prompt via rule-based translator.
  source_prompt: 2-level multilevel power simulation with 60 schools, 25 students
    per school, ICC 0.2, treatment effect 0.35, random slope for x1, 15% MAR missingness,
    500 replications
  tags:
    - power_analysis
    - 2-level
    - gaussian
    - mar
design_type: power_analysis
hierarchy:
  levels: 2
  n_obs: ~
  n_clusters: 60
  cluster_size: 25
  cluster_size_dist: fixed
  cluster_size_sd: ~
  time_points: ~
  time_spacing: ~
  cluster_name: school
  unit_name: student
  icc: 0.2
predictors:
  - name: treatment
    level: 1
    distribution: binary
    mean: ~
    sd: ~
    prob: 0.5
    min: ~
    max: ~
    centering: none
    role: treatment
  - name: x1
    level: 1
    distribution: normal
    mean: 0.0
    sd: 1.0
    prob: ~
    min: ~
    max: ~
    centering: none
    role: covariate
predictor_corr: ~
outcome:
  name: 'y'
  family: gaussian
  link: identity
  residual_sd: 1.0
  error_dist: normal
  error_df: ~
  error_skew: ~
  ar1_rho: ~
effects:
  intercept: 0.0
  fixed:
    treatment: 0.35
    x1: 0.2
  interactions: []
  focal_predictor: treatment
  random:
    intercept: yes
    intercept_sd: ~
    slopes:
      - predictor: x1
        sd: 0.2
    corr_matrix:
      - - 1.0
        - 0.0
      - - 0.0
        - 1.0
missingness:
  mechanism: MAR
  rate: 0.15
  target: outcome
  auxiliary: x1
  strength: 1.0
estimator:
  engine: lmer
  reml: yes
  conf_level: 0.95
  missing_handling: complete_case
simulation:
  n_reps: 500
  seed: 2026
  alpha: 0.05
  parameter_grid: {}
defaults_rationale:
  outcome.family: Outcome distribution was not specified; defaulted to Gaussian (continuous
    outcome with identity link).
  outcome.residual_sd: Residual SD was not specified; defaulted to 1.0 so effect sizes
    are interpretable in SD units.
  predictors.treatment.level: Treatment assignment level was not stated; defaulted
    to level-1 (within-cluster randomization).
  effects.fixed.x1: Fixed effect for covariate 'x1' was not specified; defaulted to
    0.20.
  effects.random.slopes.x1.sd: Random slope SD for 'x1' was not specified; defaulted
    to 0.20.
  effects.random.corr_matrix: Random-effects correlation was not specified; defaulted
    to 0 (uncorrelated intercept and slope).
  missingness.auxiliary: Selected 'x1' as the observed auxiliary predictor driving
    MAR missingness.
  missingness.strength: Defaulted MAR log-odds slope to 1.0 (moderate dependence on
    auxiliary variable).
  simulation.alpha: Significance level alpha was not specified; defaulted to 0.05
    (two-sided).
  simulation.seed: Random seed was not specified; set deterministic seed 2026 for
    reproducibility.
  estimator.engine: Selected 'lmer' estimator matching the 2-level gaussian model
    specification.

